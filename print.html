<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Stein - Lebenslauf</title>
    <link rel="stylesheet" href="./src/print.css">
</head>
<body>
    <!-- Action Buttons (Hidden in print) -->
    <div class="print-actions">
        <button id="print-btn" class="print-action-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Drucken
        </button>
        <button id="pdf-btn" class="print-action-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            PDF Download
        </button>
    </div>

    <div class="cv-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="avatar-container">
                <img src="business.png" alt="Mark Stein" class="avatar-image">
            </div>
            <div id="sidebar-content">
                <!-- Data injected by print.js -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1 class="name" id="name">Mark Stein</h1>
                <div class="title">Software Engineer</div>
                <div class="motto" id="motto"></div>
            </header>

            <section class="section">
                <h2 class="section-title">Berufserfahrung</h2>
                <div id="projects-list">
                    <!-- Data injected by print.js -->
                </div>
            </section>

        </main>
    </div>

    <script src="js/html2pdf.bundle.min.js"></script>
    <script type="module" src="./src/print.js"></script>
</body>
</html>
